name: install

env:
  # 版本控制：
  # - 设置 VERSION 为空字符串时，下载 latest 版本
  # - 设置 VERSION 为具体版本号时（如 v1.2.3），下载指定版本
  MAAFW_REPOSITORY: "MaaXYZ/MaaFramework"
  MAAFW_VERSION: "v5.13.0"

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "tools/build_native_agent.ps1"
      - "tools/frontend/**"
      - "frontend.lock.json"
      - "tools/requirements.txt"
      - "agent/**"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "tools/build_native_agent.ps1"
      - "tools/frontend/**"
      - "frontend.lock.json"
      - "tools/requirements.txt"
      - "agent/**"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    if: ${{ !contains(github.ref_name, '-macos.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [win]
        arch: [x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        id: download_maafw
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ env.MAAFW_REPOSITORY }}
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: false

      - name: Verify pinned MaaFramework runtime
        shell: bash
        run: |
          archive_path='${{ fromJson(steps.download_maafw.outputs.downloaded_files)[0] }}'
          expected_archive=$(jq -r '.artifact.github_digest | sub("^sha256:"; "")' maaframework.lock.json)
          actual_archive=$(sha256sum "$archive_path" | awk '{ print $1 }')
          test "$actual_archive" = "$expected_archive"

          unzip -qo "$archive_path" -d deps

          jq -r '.files | to_entries[] | [.key, .value] | @tsv' maaframework.lock.json |
            while IFS=$'\t' read -r file expected; do
              actual=$(sha256sum "deps/bin/$file" | awk '{ print $1 }')
              if [[ "$actual" != "$expected" ]]; then
                echo "Hash mismatch for $file: expected $expected, got $actual" >&2
                exit 1
              fi
            done

          rm -f "$archive_path"

      - name: Install base resources and pinned runtime
        shell: bash
        run: |
          python -m pip install -r tools/requirements.txt
          python -m unittest discover -s tools -p 'test_mxu*.py'
          python -m unittest discover -s tools -p test_migrate_mxu_config.py
          python -m unittest discover -s tools -p test_install.py
          python -m unittest discover -s tools -p test_native_package.py
          python tools/install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }} --skip-agent --skip-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: MaaRoco-${{ matrix.os }}-${{ matrix.arch }}-base
          path: "install"

      - uses: actions/upload-artifact@v4
        with:
          name: MaaRoco-native-sdk
          path: |
            deps/include
            deps/lib
            deps/bin

  native_agent:
    name: Build native C++ Agent
    needs: [meta, install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MaaRoco-win-x86_64-base
          path: install

      - uses: actions/download-artifact@v4
        with:
          name: MaaRoco-native-sdk
          path: deps

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/cache@v4
        with:
          path: |
            build/frontend/cargo
            build/frontend/MXU/src-tauri/target
          key: mxu-win-x64-${{ hashFiles('frontend.lock.json', 'tools/frontend/mxu.patch') }}
          restore-keys: mxu-win-x64-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Build and install MaaRoco task frontend
        shell: pwsh
        run: |
          python -m pip install -r tools/requirements.txt
          python tools/install.py ${{ needs.meta.outputs.tag }} win x86_64 --frontend-only
          if ($LASTEXITCODE -ne 0) { throw "MaaRoco frontend build failed" }

      - name: Build, test and install native Agent
        shell: pwsh
        run: ./tools/build_native_agent.ps1

      - name: Test native Agent IPC with synthetic frames
        shell: pwsh
        run: |
          python -m pip install MaaFw==5.13.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
          python tools/test_native_agent_integration.py --install-root install
          if ($LASTEXITCODE -ne 0) { throw "Native Agent integration tests failed" }

      - name: Verify native-only release package
        shell: pwsh
        run: |
          python tools/validate_native_package.py install
          if ($LASTEXITCODE -ne 0) { throw "Release package validation failed" }
          $interface = Get-Content ./install/interface.json -Raw | ConvertFrom-Json
          if ($interface.agent.child_exec -ne "./maafw/MaaRocoAgent.exe") {
            throw "Unexpected Agent executable: $($interface.agent.child_exec)"
          }
          foreach ($legacy in @("python", "agent", "resource/model/detect/pipa_bird.onnx", "resource/pipeline/PipaBirdThrow.json")) {
            if (Test-Path (Join-Path ./install $legacy)) { throw "Legacy runtime packaged: $legacy" }
          }

      - name: Keep release archives free of user configuration
        shell: pwsh
        run: |
          # First startup creates both modes or migrates the user's existing MFA configuration.
          # Shipping generated config would overwrite settings and bypass that migration.
          $packageRoot = (Resolve-Path -LiteralPath ./install).Path
          $configRoot = [IO.Path]::GetFullPath((Join-Path $packageRoot 'config'))
          if (-not $configRoot.StartsWith($packageRoot + [IO.Path]::DirectorySeparatorChar)) {
            throw "Configuration path outside package root"
          }
          if (Test-Path -LiteralPath $configRoot) { Remove-Item -LiteralPath $configRoot -Recurse -Force }

      - uses: actions/upload-artifact@v4
        with:
          name: MaaRoco-win-x86_64
          path: "install"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    permissions:
      contents: write
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, native_agent, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MaaRoco-win-x86_64
          path: assets/MaaRoco-win-x86_64

      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done
          
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}
