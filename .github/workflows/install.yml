name: install

env:
  # 版本控制：
  # - 设置 VERSION 为空字符串时，下载 latest 版本
  # - 设置 VERSION 为具体版本号时（如 v1.2.3），下载指定版本
  MAAFW_REPOSITORY: "Tortes/MaaFramework"
  MAAFW_VERSION: "maaroco-d6381bd7"
  MFAA_VERSION: ""

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "tools/bundle_embedded_python.ps1"
      - "tools/runtime-requirements.txt"
      - "**.py"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "tools/bundle_embedded_python.ps1"
      - "tools/runtime-requirements.txt"
      - "**.py"
  workflow_dispatch:

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [win]
        arch: [x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download MaaFramework
        id: download_maafw
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ env.MAAFW_REPOSITORY }}
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: ${{ env.MAAFW_VERSION == '' }}
          tag: ${{ env.MAAFW_VERSION }}
          out-file-path: "deps"
          extract: false

      - name: Verify pinned MaaFramework runtime
        shell: bash
        run: |
          archive_path='${{ fromJson(steps.download_maafw.outputs.downloaded_files)[0] }}'
          expected_archive=$(jq -r '.artifact.github_digest | sub("^sha256:"; "")' maaframework.lock.json)
          actual_archive=$(sha256sum "$archive_path" | awk '{ print $1 }')
          test "$actual_archive" = "$expected_archive"

          unzip -qo "$archive_path" -d deps

          jq -r '.files | to_entries[] | [.key, .value] | @tsv' maaframework.lock.json |
            while IFS=$'\t' read -r file expected; do
              actual=$(sha256sum "deps/bin/$file" | awk '{ print $1 }')
              if [[ "$actual" != "$expected" ]]; then
                echo "Hash mismatch for $file: expected $expected, got $actual" >&2
                exit 1
              fi
            done

          rm -f "$archive_path"

      - name: Download MFAAvalonia
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        with:
          repository: SweetSmellFox/MFAAvalonia
          fileName: "MFAAvalonia-*-${{ (matrix.os == 'win' && 'win') || (matrix.os == 'macos' && 'osx') || (matrix.os == 'linux' && 'linux') }}-${{ (matrix.arch == 'x86_64' && 'x64') || (matrix.arch == 'aarch64' && 'arm64') }}*"
          latest: ${{ env.MFAA_VERSION == '' }}
          tag: ${{ env.MFAA_VERSION }}
          out-file-path: "MFA"
          extract: true

      - name: Clean up MFAAvalonia archive
        if: matrix.os != 'android'
        shell: bash
        run: |
          ARCHIVE_FILE_PATH="${{ fromJson(steps.download_mfa.outputs.downloaded_files)[0] }}"
          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MFAAvalonia."

      - name: Apply MaaRoco branding to Windows executable
        if: matrix.os == 'win' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          readonly RCEDIT_SHA256="3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400eade2a"
          curl -fL --retry 3 \
            https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe \
            -o rcedit.exe
          echo "$RCEDIT_SHA256  rcedit.exe" | sha256sum --check --strict

          if ! command -v wine >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y wine
          fi

          WINEDEBUG=-all wine ./rcedit.exe MFA/MFAAvalonia.exe \
            --set-icon assets/locales/MaaRoco.ico \
            --set-version-string ProductName MaaRoco \
            --set-version-string CompanyName MaaRoco \
            --set-version-string FileDescription MaaRoco \
            --set-version-string InternalName MaaRoco \
            --set-version-string OriginalFilename MaaRoco.exe

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: |
          rm -rf MFA/runtimes
      
      - name: Install
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }} --skip-python
          cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: MaaRoco-${{ matrix.os }}-${{ matrix.arch }}-base
          path: "install"

  bundle_python:
    name: Bundle embedded Python
    needs: [meta, install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - uses: actions/download-artifact@v4
        with:
          name: MaaRoco-win-x86_64-base
          path: install

      - name: Bundle CPython and runtime dependencies
        shell: pwsh
        run: >-
          ./tools/bundle_embedded_python.ps1
          -InstallRoot ./install
          -Requirements ./tools/runtime-requirements.txt

      - name: Verify packaged Agent entry point
        shell: pwsh
        run: |
          $interface = Get-Content ./install/interface.json -Raw | ConvertFrom-Json
          if ($interface.agent.child_exec -ne "./python/python.exe") {
            throw "Unexpected Agent executable: $($interface.agent.child_exec)"
          }
          if (-not (Test-Path ./install/python/python.exe -PathType Leaf)) {
            throw "Embedded Python executable is missing"
          }
          if (-not (Test-Path ./install/agent/main.py -PathType Leaf)) {
            throw "Agent entry point is missing"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: MaaRoco-win-x86_64
          path: "install"

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    permissions:
      contents: write
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, bundle_python, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MaaRoco-win-x86_64
          path: assets/MaaRoco-win-x86_64

      - run: |
          cd assets
          for f in *; do
            (cd $f && zip -r ../$f-${{ needs.meta.outputs.tag }}.zip .)
          done
          
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'MaaXYZ' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
